name: Grounding Shadow Prototype Audit

on:
  pull_request:
    branches: [main]
    paths:
      - 'grounding/**'
      - '.github/workflows/grounding-shadow.yml'

permissions:
  contents: read

jobs:
  grounding-tests:
    name: Grounding unit and syntax checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check
        run: |
          node --check grounding/contracts.js
          node --check grounding/validator.js
          node --check grounding/shadow.js
          node --check grounding/grounding.test.js
      - name: Run grounding tests
        run: node --test grounding/grounding.test.js
